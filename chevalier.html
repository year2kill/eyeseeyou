<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>YEAR2KILL</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    position: relative;

    background:
      url("eyesurgery.png")
      no-repeat
      center center
      fixed;

    background-size: cover;

    color: #ffffff;

    font-family:
      "Courier New",
      "Liberation Mono",
      monospace;
  }

  /* =========================================
     YEAR2KILL LOGO
  ========================================= */

  @keyframes logo-float {
    0% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-15px);
    }

    100% {
      transform: translateY(0);
    }
  }

  .logo-container {
    position: fixed;

    top: max(22px, env(safe-area-inset-top));
    left: 50%;

    width: 100%;

    transform: translateX(-50%);

    text-align: center;

    z-index: 30;

    pointer-events: none;
  }

  .logo-container a {
    display: inline-block;
    pointer-events: auto;
  }

  .logo {
    display: block;

    width: min(520px, 72vw);
    height: auto;

    margin: 0 auto;

    animation:
      logo-float
      3s
      ease-in-out
      infinite;

    cursor: pointer;

    filter:
      drop-shadow(
        0 8px 18px
        rgba(0, 0, 0, 0.8)
      );
  }

  /* =========================================
     FLOATING PNG EYEBALLS
  ========================================= */

  .floating-eye {
    position: fixed;

    left: 0;
    top: 0;

    object-fit: contain;

    pointer-events: none;
    user-select: none;

    transform-origin: center;
    will-change: transform;

    filter:
      drop-shadow(
        0 0 12px
        rgba(255, 0, 0, 0.15)
      );

    z-index: 2;
  }

  /* =========================================
     TERMINAL POSITION
  ========================================= */

  .terminal {
    position: fixed;

    left: 50%;
    top: 61%;

    width: min(900px, 94vw);
    height: min(590px, 68vh);

    display: flex;
    flex-direction: column;

    transform: translate(-50%, -50%);

    background: #000000;
    border: 1px solid #666666;

    box-shadow:
      0 18px 55px
      rgba(0, 0, 0, 0.92),

      0 0 0 1px
      #222222;

    overflow: hidden;

    z-index: 20;
  }

  /* =========================================
     TERMINAL TITLE BAR
  ========================================= */

  .title-bar {
    min-height: 33px;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0 80px;

    background:
      linear-gradient(
        to bottom,
        #666666,
        #3b3b3b
      );

    color: #ffffff;

    font-family:
      Arial,
      sans-serif;

    font-size: 14px;
  }

  .window-controls {
    position: absolute;
    left: 10px;

    display: flex;
    gap: 8px;
  }

  .window-control {
    width: 15px;
    height: 15px;

    border: 2px solid #777777;
    border-radius: 50%;

    background: #292929;

    box-shadow:
      inset 0 1px 2px
      rgba(255, 255, 255, 0.18),

      0 1px 2px
      rgba(0, 0, 0, 0.8);
  }

  /* =========================================
     TERMINAL MENU
  ========================================= */

  .menu-bar {
    min-height: 31px;

    display: flex;
    align-items: center;
    gap: 24px;

    padding: 0 12px;

    background: #282828;
    color: #ffffff;

    font-family:
      Arial,
      sans-serif;

    font-size: 14px;

    border-bottom: 1px solid #111111;
  }

  /* =========================================
     TERMINAL SCREEN
  ========================================= */

  .terminal-screen {
    position: relative;

    flex: 1;
    min-height: 0;

    overflow: hidden;

    background: #000000;
  }

  .startup-line {
    position: absolute;

    top: 11px;
    left: 12px;

    color: #00ff32;

    font-size: 14px;

    white-space: pre;

    z-index: 4;
  }

  .startup-command {
    color: #dddddd;
  }

  /* =========================================
     ASCII EYE
  ========================================= */

  .ascii-eye {
    position: absolute;

    left: 50%;
    top: 42%;

    margin: 0;

    color: #ededed;

    font-family:
      "Courier New",
      "Liberation Mono",
      monospace;

    font-size: clamp(6px, 1.1vw, 11px);
    font-weight: bold;

    line-height: 0.88;
    letter-spacing: 0;

    white-space: pre;

    user-select: none;
    pointer-events: none;

    text-shadow:
      0 0 3px
      rgba(255, 255, 255, 0.16);

    transform:
      translate(-50%, -50%);

    transition:
      left 1.8s ease-in-out,
      top 1.8s ease-in-out,
      opacity 0.15s linear;
  }

  .ascii-eye.flicker {
    opacity: 0.7;
  }

  /* =========================================
     STATUS
  ========================================= */

  .terminal-status {
    position: absolute;

    top: 45px;
    right: 16px;

    color: #00ff32;

    font-size: 12px;
    line-height: 1.4;

    text-align: right;

    opacity: 0.72;

    z-index: 4;
  }

  /* =========================================
     TYPED MESSAGE
  ========================================= */

  .terminal-message {
    position: absolute;

    left: 18px;
    right: 18px;
    bottom: 44px;

    max-height: 160px;

    overflow-y: auto;

    padding: 10px 12px;

    background:
      rgba(0, 0, 0, 0.92);

    border-left:
      2px solid #00ff32;

    color: #dddddd;

    font-size:
      clamp(10px, 1.3vw, 14px);

    line-height: 1.45;

    white-space: pre-wrap;
    overflow-wrap: anywhere;

    scrollbar-width: none;

    z-index: 5;
  }

  .terminal-message:empty {
    display: none;
  }

  .terminal-message::-webkit-scrollbar {
    display: none;
  }

  .warning-text {
    color: #dddddd;
  }

  .ip-text {
    color: #00ff32;
    font-weight: bold;

    text-shadow:
      0 0 5px
      rgba(0, 255, 50, 0.35);
  }

  .typing-cursor {
    display: inline-block;

    width: 8px;
    height: 14px;

    margin-left: 3px;

    background: currentColor;

    vertical-align: -2px;

    animation:
      cursor-blink
      0.82s
      steps(1)
      infinite;
  }

  /* =========================================
     TERMINAL PROMPT
  ========================================= */

  .terminal-prompt {
    position: absolute;

    left: 12px;
    bottom: 11px;

    color: #00ff32;

    font-size: 14px;

    white-space: nowrap;

    z-index: 6;
  }

  .terminal-cursor {
    display: inline-block;

    width: 9px;
    height: 17px;

    margin-left: 4px;

    background: #00ff32;

    vertical-align: -3px;

    animation:
      cursor-blink
      0.82s
      steps(1)
      infinite;
  }

  @keyframes cursor-blink {
    0%,
    48% {
      opacity: 1;
    }

    49%,
    100% {
      opacity: 0;
    }
  }

  /* =========================================
     MOBILE
  ========================================= */

  @media (max-width: 650px) {
    .logo-container {
      top: max(
        18px,
        env(safe-area-inset-top)
      );
    }

    .logo {
      width: min(440px, 76vw);
    }

    .terminal {
      top: 63%;

      width: 94vw;
      height: min(540px, 58vh);
    }

    .title-bar {
      min-height: 30px;

      padding: 0 60px;

      font-size: 12px;
    }

    .window-control {
      width: 13px;
      height: 13px;
    }

    .menu-bar {
      min-height: 28px;

      gap: 13px;

      font-size: 11px;
    }

    .menu-bar span:nth-last-child(-n + 2) {
      display: none;
    }

    .ascii-eye {
      top: 34%;

      font-size:
        clamp(4.3px, 1.4vw, 7px);

      transform:
        translate(-50%, -50%)
        scale(0.82);
    }

    .terminal-status {
      display: none;
    }

    .startup-line,
    .terminal-prompt {
      font-size: 11px;
    }

    .terminal-message {
      left: 12px;
      right: 12px;
      bottom: 38px;

      max-height: 185px;

      padding: 8px 9px;

      font-size: 10px;
      line-height: 1.4;
    }
  }

  @media (max-height: 700px) {
    .logo-container {
      top: 10px;
    }

    .logo {
      width: min(380px, 56vw);
    }

    .terminal {
      top: 61%;

      height: min(500px, 66vh);
    }
  }
</style>
</head>

<div class="logo-container">
  <a href="https://year2kill.github.io/year2kill/index3.html">
    <img
      src="y2k2026.png"
      alt="YEAR2KILL"
      class="logo"
    >
  </a>
</div>

    <div class="window-controls">

    <span>View</span>
    <span>Search</span>
    <span>Terminal</span>
    <span>Help</span>
  </div>

    class="terminal-screen"
    id="terminalScreen"
  >

    <div class="startup-line">watcher@unknown:~$ <span class="startup-command">./observe</span></div>

      id="terminalStatus"

      SUBJECT: DETECTED

      class="ascii-eye"
      id="asciiEye"
      aria-label="Animated ASCII eye"
    ></pre>

    <div
      class="terminal-message"
      id="terminalMessage"
      aria-live="polite"
    ></div>

    <div class="terminal-prompt">
      watcher@unknown:~$<span class="terminal-cursor"></span>
    </div>

  </div>
</div>

<script>
"use strict";

/* =========================================
   FLOATING PNG EYES
========================================= */

const EYE_COUNT = 20;

const MIN_SIZE = 70;
const MAX_SIZE = 170;

const MIN_SPEED = 0.4;
const MAX_SPEED = 1.8;

const LOOK_SPEED = 0.08;

const floatingEyes = [];

const mouse = {
  x: window.innerWidth / 2,
  y: window.innerHeight / 2,
  active: false
};

function randomBetween(min, max) {
  return Math.random() * (max - min) + min;
}

function createFloatingEye() {
  const image =
    document.createElement("img");

  image.src = "eyeball.png";
  image.className = "floating-eye";
  image.alt = "";
  image.draggable = false;

  const size =
    randomBetween(
      MIN_SIZE,
      MAX_SIZE
    );

  image.style.width =
    `${size}px`;

  image.style.height =
    `${size}px`;

  document.body.appendChild(image);

  const movementAngle =
    randomBetween(
      0,
      Math.PI * 2
    );

  const speed =
    randomBetween(
      MIN_SPEED,
      MAX_SPEED
    );

  floatingEyes.push({
    element: image,

    size,

    x: randomBetween(
      0,
      Math.max(
        0,
        window.innerWidth - size
      )
    ),

    y: randomBetween(
      0,
      Math.max(
        0,
        window.innerHeight - size
      )
    ),

    velocityX:
      Math.cos(movementAngle) *
      speed,

    velocityY:
      Math.sin(movementAngle) *
      speed,

    currentLookAngle: 0,

    floatOffset:
      randomBetween(
        0,
        Math.PI * 2
      ),

    floatSpeed:
      randomBetween(
        0.01,
        0.025
      ),

    floatAmount:
      randomBetween(
        4,
        12
      )
  });
}

window.addEventListener(
  "mousemove",
  event => {
    mouse.x = event.clientX;
    mouse.y = event.clientY;
    mouse.active = true;
  }
);

window.addEventListener(
  "touchmove",
  event => {
    const touch =
      event.touches[0];

    if (!touch) {
      return;
    }

    mouse.x = touch.clientX;
    mouse.y = touch.clientY;
    mouse.active = true;
  },
  {
    passive: true
  }
);

function shortestAngleDifference(
  currentAngle,
  targetAngle
) {
  let difference =
    targetAngle - currentAngle;

  while (difference > 180) {
    difference -= 360;
  }

  while (difference < -180) {
    difference += 360;
  }

  return difference;
}

function animateFloatingEyes(time) {
  for (const floatingEye of floatingEyes) {
    floatingEye.x +=
      floatingEye.velocityX;

    floatingEye.y +=
      floatingEye.velocityY;

    const maxX =
      Math.max(
        0,
        window.innerWidth -
        floatingEye.size
      );

    const maxY =
      Math.max(
        0,
        window.innerHeight -
        floatingEye.size
      );

    if (floatingEye.x <= 0) {
      floatingEye.x = 0;

      floatingEye.velocityX =
        Math.abs(
          floatingEye.velocityX
        );
    }

    if (floatingEye.x >= maxX) {
      floatingEye.x = maxX;

      floatingEye.velocityX =
        -Math.abs(
          floatingEye.velocityX
        );
    }

    if (floatingEye.y <= 0) {
      floatingEye.y = 0;

      floatingEye.velocityY =
        Math.abs(
          floatingEye.velocityY
        );
    }

    if (floatingEye.y >= maxY) {
      floatingEye.y = maxY;

      floatingEye.velocityY =
        -Math.abs(
          floatingEye.velocityY
        );
    }

    const floatingY =
      Math.sin(
        time *
        floatingEye.floatSpeed +
        floatingEye.floatOffset
      ) *
      floatingEye.floatAmount;

    const centerX =
      floatingEye.x +
      floatingEye.size / 2;

    const centerY =
      floatingEye.y +
      floatingY +
      floatingEye.size / 2;

    const cursorAngle =
      Math.atan2(
        mouse.y - centerY,
        mouse.x - centerX
      ) *
      180 /
      Math.PI;

    const angleDifference =
      shortestAngleDifference(
        floatingEye.currentLookAngle,
        cursorAngle
      );

    floatingEye.currentLookAngle +=
      angleDifference *
      LOOK_SPEED;

    floatingEye.element.style.transform = `
      translate3d(
        ${floatingEye.x}px,
        ${floatingEye.y + floatingY}px,
        0
      )
      rotate(
        ${floatingEye.currentLookAngle}deg
      )
    `;
  }

  requestAnimationFrame(
    animateFloatingEyes
  );
}

for (
  let index = 0;
  index < EYE_COUNT;
  index++
) {
  createFloatingEye();
}

    " .,;;;;;;:lcloolldOKNWMMMMMMMMMMMMMMMMMMMMMMWNKOdlc.   ;clc:;;;;;;;.",

const frameNames =
  Object.keys(rawFrames);

const frameHeight =
  Math.max(
    ...frameNames.map(
      name =>
        rawFrames[name].length
    )
  );

const frameWidth =
  Math.max(
    ...frameNames.flatMap(
      name =>
        rawFrames[name].map(
          line =>
            line.length
        )
    )
  );

function normalizeFrame(lines) {
  const normalizedLines = [];

  for (
    let row = 0;
    row < frameHeight;
    row++
  ) {
    const line =
      lines[row] || "";

    const remainingSpace =
      frameWidth -
      line.length;

    const leftPadding =
      Math.floor(
        remainingSpace / 2
      );

    const rightPadding =
      remainingSpace -
      leftPadding;

    normalizedLines.push(
      " ".repeat(leftPadding) +
      line +
      " ".repeat(rightPadding)
    );
  }

  return normalizedLines.join("\n");
}

const eyeFrames = {};

for (const name of frameNames) {
  eyeFrames[name] =
    normalizeFrame(
      rawFrames[name]
    );
}

for (
  const [name, frame]
  of Object.entries(eyeFrames)
) {
  const rows =
    frame.split("\n");

  const valid =
    rows.length === frameHeight &&
    rows.every(
      row =>
        row.length === frameWidth
    );

  if (!valid) {
    throw new Error(
      `Frame "${name}" failed normalization.`
    );
  }
}

let currentDirection = "center";
let blinking = false;
let looking = false;

asciiEye.textContent =
  eyeFrames.center;

function displayFrame(
  name,
  flicker = false
) {
  if (flicker) {
    asciiEye.classList.add(
      "flicker"
    );
  }

  asciiEye.textContent =
    eyeFrames[name];

  window.setTimeout(
    () => {
      asciiEye.classList.remove(
        "flicker"
      );
    },
    55
  );
}

function lookAround() {
  if (blinking || looking) {
    scheduleNextLook();
    return;
  }

  looking = true;

  const possibleSequences = [
    ["left"],
    ["right"],
    ["left", "center"],
    ["right", "center"],
    ["left", "right"],
    ["right", "left"],
    ["left", "center", "right"],
    ["right", "center", "left"]
  ];

  const sequence =
    possibleSequences[
      Math.floor(
        Math.random() *
        possibleSequences.length
      )
    ];

  let step = 0;

  function runStep() {
    if (
      blinking ||
      step >= sequence.length
    ) {
      looking = false;
      scheduleNextLook();
      return;
    }

    currentDirection =
      sequence[step];

    displayFrame(
      currentDirection,
      true
    );

    step++;

    window.setTimeout(
      runStep,
      90 +
      Math.random() *
      170
    );
  }

  runStep();
}

function scheduleNextLook() {
  window.setTimeout(
    lookAround,
    650 +
    Math.random() *
    2300
  );
}

function blink() {
  if (blinking) {
    scheduleNextBlink();
    return;
  }

  blinking = true;

  displayFrame(
    "halfBlink"
  );

  window.setTimeout(
    () => {
      displayFrame(
        "closed"
      );
    },
    80
  );

  window.setTimeout(
    () => {
      displayFrame(
        "halfBlink"
      );
    },
    165
  );

  window.setTimeout(
    () => {
      displayFrame(
        currentDirection
      );

      blinking = false;

      if (Math.random() < 0.2) {
        window.setTimeout(
          blink,
          170
        );
      } else {
        scheduleNextBlink();
      }
    },
    250
  );
}

function scheduleNextBlink() {
  window.setTimeout(
    blink,
    1800 +
    Math.random() *
    4300
  );
}

function moveWholeEye() {
  const isMobile =
    window.matchMedia(
      "(max-width: 650px)"
    ).matches;

  const x =
    46 +
    Math.random() *
    8;

  const y =
    isMobile
      ? 31 + Math.random() * 6
      : 39 + Math.random() * 7;

  asciiEye.style.left =
    `${x}%`;

  asciiEye.style.top =
    `${y}%`;

  window.setTimeout(
    moveWholeEye,
    2400 +
    Math.random() *
    3300
  );
}

/* =========================================
   TERMINAL STATUS
========================================= */

const statusMessages = [
  "OPTICAL FEED: ACTIVE<br>SUBJECT: DETECTED",

  "TRACKING: ENABLED<br>FOCUS: LOCKED",

  "MOVEMENT: DETECTED<br>AWAITING INPUT",

  "VISUAL LINK: STABLE<br>WATCHER: ONLINE"
];

function updateStatus() {
  terminalStatus.innerHTML =
    statusMessages[
      Math.floor(
        Math.random() *
        statusMessages.length
      )
    ];

  window.setTimeout(
    updateStatus,
    1800 +
    Math.random() *
    2500
  );
}

/* =========================================
   SURVEILLANCE MESSAGE
========================================= */

const surveillanceMessage =
  "Every year, Palantir sells software that helps " +
  "governments, militaries, police departments, and " +
  "corporations combine vast stores of personal and " +
  "institutional data: turning scattered records about " +
  "people like you and I into searchable profiles, " +
  "relationships, predictions, and operational decisions.";

function sleep(milliseconds) {
  return new Promise(
    resolve => {
      window.setTimeout(
        resolve,
        milliseconds
      );
    }
  );
}

function createTypingLine(
  className = ""
) {
  const line =
    document.createElement(
      "span"
    );

  line.className =
    className;

  const cursor =
    document.createElement(
      "span"
    );

  cursor.className =
    "typing-cursor";

  terminalMessage.appendChild(
    line
  );

  terminalMessage.appendChild(
    cursor
  );

  return {
    line,
    cursor
  };
}

async function typeText(
  text,
  target,
  {
    minimumDelay = 18,
    maximumDelay = 42,
    sentencePause = 650,
    punctuationPause = 150
  } = {}
) {
  for (const character of text) {
    target.textContent +=
      character;

    terminalMessage.scrollTop =
      terminalMessage.scrollHeight;

    let delay =
      minimumDelay +
      Math.random() *
      (
        maximumDelay -
        minimumDelay
      );

    if (
      character === "." ||
      character === "!" ||
      character === "?"
    ) {
      delay += sentencePause;
    } else if (
      character === "," ||
      character === ":" ||
      character === ";"
    ) {
      delay += punctuationPause;
    }

    await sleep(delay);
  }
}

/* =========================================
   PUBLIC IP LOOKUP
========================================= */

async function getPublicIp() {
  const controller =
    new AbortController();

  const timeout =
    window.setTimeout(
      () => {
        controller.abort();
      },
      7000
    );

  try {
    const response =
      await fetch(
        "https://api64.ipify.org?format=json",
        {
          method: "GET",
          cache: "no-store",
          signal:
            controller.signal
        }
      );

    if (!response.ok) {
      throw new Error(
        `IP request failed with status ${response.status}.`
      );
    }

    const data =
      await response.json();

    if (
      typeof data.ip !== "string" ||
      data.ip.trim() === ""
    ) {
      throw new Error(
        "The IP service returned invalid data."
      );
    }

    return data.ip.trim();
  } finally {
    window.clearTimeout(
      timeout
    );
  }
}

/* =========================================
   TERMINAL SEQUENCE
========================================= */

async function runTerminalSequence() {
  await sleep(1300);

  terminalMessage.style.display =
    "block";

  const warning =
    createTypingLine(
      "warning-text"
    );

  await typeText(
    surveillanceMessage,
    warning.line,
    {
      minimumDelay: 14,
      maximumDelay: 34,
      sentencePause: 900,
      punctuationPause: 190
    }
  );

  warning.cursor.remove();

  await sleep(1100);

  terminalMessage.appendChild(
    document.createElement(
      "br"
    )
  );

  terminalMessage.appendChild(
    document.createElement(
      "br"
    )
  );

  const result =
    createTypingLine(
      "ip-text"
    );

  await typeText(
    "EYE SEE YOU!",
    result.line,
    {
      minimumDelay: 42,
      maximumDelay: 80,
      sentencePause: 750,
      punctuationPause: 150
    }
  );

  await sleep(550);

  await typeText(
    " IP ADDRESS: ",
    result.line,
    {
      minimumDelay: 30,
      maximumDelay: 65,
      sentencePause: 0,
      punctuationPause: 250
    }
  );

  try {
    const ipAddress =
      await getPublicIp();

    await sleep(450);

    await typeText(
      ipAddress,
      result.line,
      {
        minimumDelay: 45,
        maximumDelay: 90,
        sentencePause: 0,
        punctuationPause: 80
      }
    );
  } catch (error) {
    console.error(error);

    await typeText(
      "UNAVAILABLE",
      result.line,
      {
        minimumDelay: 45,
        maximumDelay: 80,
        sentencePause: 0,
        punctuationPause: 0
      }
    );
  }
}

/* =========================================
   RESIZE HANDLING
========================================= */

window.addEventListener(
  "resize",
  () => {
    mouse.x =
      window.innerWidth / 2;

    mouse.y =
      window.innerHeight / 2;

    for (
      const floatingEye
      of floatingEyes
    ) {
      floatingEye.x =
        Math.min(
          floatingEye.x,
          Math.max(
            0,
            window.innerWidth -
            floatingEye.size
          )
        );

      floatingEye.y =
        Math.min(
          floatingEye.y,
          Math.max(
            0,
            window.innerHeight -
            floatingEye.size
          )
        );
    }
  }
);

/* =========================================
   START
========================================= */

scheduleNextLook();
scheduleNextBlink();

window.setTimeout(
  moveWholeEye,
  1200
);

window.setTimeout(
  updateStatus,
  1600
);

runTerminalSequence();

requestAnimationFrame(
  animateFloatingEyes
);
</script>
