<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Floating Eyes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

.eye{
    position:fixed;
    width:140px;
    height:140px;
    pointer-events:none;
    user-select:none;
    will-change:transform;
    filter:drop-shadow(0 0 12px rgba(255,0,0,.15));
}
</style>
</head>

<body>

<script>

const EYE_COUNT = 15;

const MIN_SIZE = 70;
const MAX_SIZE = 170;

const MIN_SPEED = 0.4;
const MAX_SPEED = 1.8;

const eyes = [];

function rand(min,max){
    return Math.random()*(max-min)+min;
}

function createEye(){

    const img = document.createElement("img");

    img.src = "eyeball.png";
    img.className = "eye";
    img.draggable = false;

    const size = rand(MIN_SIZE,MAX_SIZE);

    img.style.width = size + "px";
    img.style.height = size + "px";

    document.body.appendChild(img);

    const angle = rand(0,Math.PI*2);
    const speed = rand(MIN_SPEED,MAX_SPEED);

    eyes.push({

        element:img,

        size:size,

        x:rand(0,window.innerWidth-size),
        y:rand(0,window.innerHeight-size),

        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,

        rotation:rand(0,360),
        rotationSpeed:rand(-0.15,0.15),

        floatOffset:rand(0,Math.PI*2),
        floatSpeed:rand(.01,.025),
        floatAmount:rand(4,12)

    });

}

for(let i=0;i<EYE_COUNT;i++){
    createEye();
}

function animate(time){

    for(const eye of eyes){

        eye.x += eye.vx;
        eye.y += eye.vy;

        eye.rotation += eye.rotationSpeed;

        const maxX = window.innerWidth-eye.size;
        const maxY = window.innerHeight-eye.size;

        if(eye.x<=0){
            eye.x=0;
            eye.vx=Math.abs(eye.vx);
        }

        if(eye.x>=maxX){
            eye.x=maxX;
            eye.vx=-Math.abs(eye.vx);
        }

        if(eye.y<=0){
            eye.y=0;
            eye.vy=Math.abs(eye.vy);
        }

        if(eye.y>=maxY){
            eye.y=maxY;
            eye.vy=-Math.abs(eye.vy);
        }

        const floatY =
            Math.sin(time*eye.floatSpeed+eye.floatOffset)
            *eye.floatAmount;

        eye.element.style.transform =
            `translate(${eye.x}px,${eye.y+floatY}px) rotate(${eye.rotation}deg)`;

    }

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

window.addEventListener("resize",()=>{

    for(const eye of eyes){

        eye.x=Math.min(
            eye.x,
            window.innerWidth-eye.size
        );

        eye.y=Math.min(
            eye.y,
            window.innerHeight-eye.size
        );

    }

});

</script>

</body>
</html>
